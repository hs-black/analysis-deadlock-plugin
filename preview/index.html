<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阵容助手 · 开发预览</title>
<style>body{margin:0;background:#0e171d;color:#dae6e5;font:15px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:32px auto;padding:24px}h1{margin:0;color:#e2e9b4}h2{font-size:19px;color:#d9e7ae}section,aside{background:#18262e;border:1px solid #33454b;border-radius:12px;padding:20px;margin-top:18px}.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.teams,.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button,select{background:#2a414b;color:#eff6f3;border:1px solid #56727c;border-radius:5px;padding:8px;margin:3px;max-width:100%}button{cursor:pointer}button:hover{background:#42616b}.muted{color:#9db0b7;font-size:13px}.warn{color:#f1c178}.card{border-bottom:1px solid #33454b;padding:10px 0}label{display:block}input{accent-color:#b4d47a}pre{white-space:pre-wrap}#error{color:#ffb4a5}@media(max-width:850px){.columns{grid-template-columns:1fr}.pool{grid-template-columns:repeat(2,1fr)}} </style>
<main><h1>阵容助手</h1><p class="muted">开发预览 0.2.0 · 使用模拟阵容，与 Deadlock 未连接。这里运行与 HUD 相同的分析引擎，浏览器样式不代表游戏内最终效果。</p>
<div class="columns"><div><section><h2>阵容与对线</h2><div id="teams" class="teams"></div><button id="capture">读入阵容</button><button id="reset">下一局：清空快照</button><p id="status"></p><div id="selectors"></div><p id="error"></p></section>
<section><h2>排位英雄池</h2><p class="muted">只勾选你确认解锁的英雄。机制规则待核对的英雄，在统计样本充分时仍可参与统计比较。资源标为非活跃的英雄默认不推荐。</p><div id="pool" class="pool"></div><button id="export">导出 my.json</button><label>导入已有配置 <input type="file" id="import" accept=".json"></label></section></div>
<aside><h2>HUD 内容预览</h2><div id="result">读入阵容后显示。</div></aside></div></main><script src="/data.js"></script><script src="/stats-data.js"></script><script src="/statistics.js"></script><script src="/engine.js"></script><script src="/preview.js"></script></html>
